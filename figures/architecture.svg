<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="title desc">
  <title id="title">libdes architecture</title>
  <desc id="desc">A des::network holds the nodes (source, station, sink), a next-event heap, the routing matrix and flow statistics. Each simulation step takes the node with the earliest completion from the heap, lets its next job depart, samples the next node from the routing matrix and hands the job to that node, which puts it in a free server or a waiting queue. Every queue delegates admission and ordering to a policy, which creates the job store holding its jobs. Observers attached to node signals receive the event fields as a message and keep per-class statistics across runs.</desc>
  <style>
    .bg { fill: #ffffff; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .h { font-size: 13px; font-weight: 600; }
    .b { font-weight: 600; }
    .s { font-size: 11px; }
    .mut { fill: #59636e; }
    .frame { fill: none; stroke: #d1d9e0; stroke-width: 1.5; }
    .box { fill: #f6f8fa; stroke: #818b98; stroke-width: 1.2; }
    .dash { stroke-dasharray: 5 3; }
    .ln { fill: none; stroke: #59636e; stroke-width: 1.3; }
    .lnf { fill: #59636e; }
    .lead { fill: none; stroke: #818b98; stroke-width: 1; stroke-dasharray: 2 3; }
    .acc { fill: none; stroke: #0969da; stroke-width: 1.8; }
    .accf { fill: #0969da; }
    .q { fill: none; stroke: #1f2328; stroke-width: 1.3; }
    .srv { fill: #ffffff; stroke: #1f2328; stroke-width: 1.3; }
    .job { fill: #818b98; }
    .badge text { fill: #ffffff; font-size: 10px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      text { fill: #e6edf3; }
      .mut { fill: #9198a1; }
      .frame { stroke: #3d444d; }
      .box { fill: #151b23; stroke: #656c76; }
      .ln { stroke: #9198a1; }
      .lnf { fill: #9198a1; }
      .lead { stroke: #656c76; }
      .acc { stroke: #4493f8; }
      .accf { fill: #4493f8; }
      .q { stroke: #e6edf3; }
      .srv { fill: #0d1117; stroke: #e6edf3; }
      .job { fill: #9198a1; }
      .badge text { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="head-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="accf"/>
    </marker>
    <marker id="head-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="lnf"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="660"/>

  <!-- Your program: drives the loop -->
  <rect class="box" x="20" y="20" width="210" height="236" rx="8"/>
  <text class="h" x="36" y="44">Your program</text>
  <text class="mono mut" x="36" y="70">// every event</text>
  <text class="mono" x="36" y="90">e = net.next_event();</text>
  <g class="badge"><circle class="accf" cx="44" cy="106" r="8"/><text x="44" y="109.5" text-anchor="middle">1</text></g>
  <text x="58" y="110">heap picks a node</text>
  <g class="badge"><circle class="accf" cx="44" cy="126" r="8"/><text x="44" y="129.5" text-anchor="middle">2</text></g>
  <text x="58" y="130">its next job departs</text>
  <text class="mono" x="36" y="156">net.route(e);</text>
  <g class="badge"><circle class="accf" cx="44" cy="172" r="8"/><text x="44" y="175.5" text-anchor="middle">3</text></g>
  <text x="58" y="176">routing picks next node</text>
  <g class="badge"><circle class="accf" cx="44" cy="192" r="8"/><text x="44" y="195.5" text-anchor="middle">4</text></g>
  <text x="58" y="196">job enters that node</text>
  <text class="mono mut" x="36" y="222">// after each run</text>
  <text class="mono" x="36" y="242">net.reset(t, keys, true);</text>

  <!-- Shared random number generator -->
  <rect class="box" x="20" y="346" width="210" height="94" rx="8"/>
  <text class="mono b" x="36" y="370">std::mt19937_64</text>
  <text x="36" y="392">one seeded generator for</text>
  <text x="36" y="410">sources, stations and the</text>
  <text x="36" y="428">routing: reproducible runs</text>

  <!-- Legend -->
  <rect class="box dash" x="20" y="560" width="30" height="20" rx="4"/>
  <text x="60" y="567">replaceable: pass or</text>
  <text x="60" y="582">derive your own</text>
  <line class="acc" x1="20" y1="616" x2="48" y2="616" marker-end="url(#head-acc)"/>
  <text x="60" y="620">the simulation loop</text>

  <!-- des::network -->
  <rect class="frame" x="250" y="20" width="730" height="420" rx="10"/>
  <text class="mono h" x="266" y="44">des::network</text>

  <rect class="box" x="266" y="60" width="222" height="76" rx="6"/>
  <text class="h" x="280" y="84">next-event heap</text>
  <text x="280" y="104">one entry per node, keyed</text>
  <text x="280" y="120">by its earliest completion</text>

  <rect class="box" x="504" y="60" width="222" height="76" rx="6"/>
  <text class="mono b" x="518" y="84">routing[from][to][class]</text>
  <text x="518" y="102">next-hop probabilities</text>
  <rect class="box dash" x="518" y="109" width="170" height="19" rx="4"/>
  <text class="s" x="527" y="122">routing and block handlers</text>

  <rect class="box" x="742" y="60" width="222" height="76" rx="6"/>
  <text class="h" x="756" y="84">flow statistics</text>
  <text x="756" y="104">events, throughput, blocked</text>
  <text x="756" y="120">per edge; losses per node</text>

  <!-- step 1: the heap names the node with the earliest completion -->
  <line class="acc" x1="316" y1="136" x2="316" y2="175" marker-end="url(#head-acc)"/>
  <g class="badge"><circle class="accf" cx="316" cy="155" r="8"/><text x="316" y="158.5" text-anchor="middle">1</text></g>
  <text class="s mut" x="330" y="159">earliest completion</text>

  <!-- node boxes first, so the job paths are drawn over their borders -->
  <rect class="box" x="266" y="176" width="100" height="244" rx="6"/>
  <rect class="box" x="430" y="176" width="358" height="244" rx="6"/>
  <rect class="box" x="852" y="176" width="112" height="244" rx="6"/>

  <!-- des::source -->
  <text class="mono b" x="278" y="200">des::source</text>
  <text x="278" y="220">Poisson</text>
  <text x="278" y="236">arrivals</text>
  <circle class="srv" cx="316" cy="286" r="17"/>
  <circle class="job" cx="316" cy="286" r="6"/>
  <text class="s mut" x="316" y="322" text-anchor="middle">next arrival</text>

  <!-- steps 2-4: departure, route, arrival -->
  <line class="acc" x1="333" y1="286" x2="444" y2="286"/>
  <text class="mono s" x="398" y="270" text-anchor="middle">route()</text>
  <g class="badge"><circle class="accf" cx="349" cy="286" r="8"/><text x="349" y="289.5" text-anchor="middle">2</text></g>
  <g class="badge"><circle class="accf" cx="398" cy="286" r="8"/><text x="398" y="289.5" text-anchor="middle">3</text></g>

  <!-- des::station -->
  <text class="mono b" x="444" y="200">des::station&lt;TT, T&gt;</text>

  <path class="acc" d="M452,278 V242 Q452,232 462,232 H690 Q700,232 700,242 V245" marker-end="url(#head-acc)"/>
  <text class="s mut" x="576" y="226" text-anchor="middle">server free</text>
  <line class="acc" x1="460" y1="282" x2="491" y2="266" marker-end="url(#head-acc)"/>
  <line class="acc" x1="460" y1="290" x2="491" y2="306" marker-end="url(#head-acc)"/>
  <g class="badge"><circle class="accf" cx="452" cy="286" r="8"/><text x="452" y="289.5" text-anchor="middle">4</text></g>

  <path class="q" d="M494,252 H604 V276 H494"/>
  <rect class="job" x="588" y="255" width="13" height="18"/>
  <rect class="job" x="572" y="255" width="13" height="18"/>
  <rect class="job" x="556" y="255" width="13" height="18"/>
  <path class="q" d="M494,296 H604 V320 H494"/>
  <rect class="job" x="588" y="299" width="13" height="18"/>
  <rect class="job" x="572" y="299" width="13" height="18"/>
  <text x="549" y="344" text-anchor="middle">waiting queues</text>

  <line class="acc" x1="606" y1="264" x2="681" y2="264" marker-end="url(#head-acc)"/>
  <line class="acc" x1="606" y1="308" x2="681" y2="308" marker-end="url(#head-acc)"/>
  <text class="s mut" x="643" y="290" text-anchor="middle">service pick</text>

  <circle class="srv" cx="700" cy="264" r="17"/>
  <circle class="job" cx="700" cy="264" r="6"/>
  <circle class="srv" cx="700" cy="308" r="17"/>
  <circle class="job" cx="700" cy="308" r="6"/>
  <text x="700" y="344" text-anchor="middle">servers</text>
  <text class="s mut" x="700" y="360" text-anchor="middle">(server queues)</text>

  <rect class="box dash" x="620" y="372" width="156" height="40" rx="4"/>
  <text class="s" x="632" y="388">service times</text>
  <text class="mono s" x="632" y="404">T&lt;TT&gt;[server][class]</text>

  <path class="acc" d="M717,264 H738 Q750,264 750,276 V286"/>
  <path class="acc" d="M717,308 H738 Q750,308 750,296 V286"/>
  <line class="acc" x1="750" y1="286" x2="890" y2="286" marker-end="url(#head-acc)"/>
  <text class="mono s" x="820" y="278" text-anchor="middle">route()</text>

  <!-- des::sink -->
  <text class="mono b" x="864" y="200">des::sink</text>
  <text x="864" y="220">absorbs jobs</text>
  <circle class="srv" cx="908" cy="286" r="17"/>
  <circle class="job" cx="908" cy="286" r="6"/>
  <text class="s mut" x="908" y="322" text-anchor="middle">service time 0</text>

  <!-- Inside every queue -->
  <line class="lead" x1="549" y1="350" x2="549" y2="470"/>
  <rect class="frame" x="250" y="470" width="370" height="170" rx="10"/>
  <text class="h" x="266" y="494">Inside every queue</text>

  <rect class="box dash" x="380" y="502" width="110" height="46" rx="6"/>
  <text class="mono b" x="435" y="522" text-anchor="middle">des::policy</text>
  <text class="s mut" x="435" y="539" text-anchor="middle">shared by queues</text>
  <text x="502" y="518">fifo · is · ps</text>
  <text class="s mut" x="502" y="534">or your own</text>

  <rect class="box" x="266" y="576" width="110" height="46" rx="6"/>
  <text class="mono b" x="321" y="596" text-anchor="middle">des::queue</text>
  <text class="s mut" x="321" y="613" text-anchor="middle">capacity</text>

  <rect class="box dash" x="494" y="576" width="110" height="46" rx="6"/>
  <text class="mono b" x="549" y="596" text-anchor="middle">job_store</text>
  <text class="s mut" x="549" y="613" text-anchor="middle">container, order</text>

  <line class="ln" x1="336" y1="574" x2="385" y2="551" marker-end="url(#head-ln)"/>
  <text class="mono s" x="352" y="556" text-anchor="end">admit()</text>
  <line class="ln" x1="484" y1="550" x2="533" y2="573" marker-end="url(#head-ln)"/>
  <text class="mono s" x="518" y="557">make_store()</text>
  <line class="ln" x1="376" y1="599" x2="492" y2="599" marker-end="url(#head-ln)"/>
  <text class="s mut" x="434" y="592" text-anchor="middle">owns</text>

  <!-- Measurement -->
  <line class="ln" x1="752" y1="420" x2="752" y2="500" marker-end="url(#head-ln)"/>
  <text class="s mut" x="762" y="459">signals: arrival, service, departure</text>
  <rect class="frame" x="640" y="470" width="340" height="170" rx="10"/>
  <text class="h" x="656" y="494">Measurement</text>

  <rect class="box" x="656" y="502" width="130" height="46" rx="6"/>
  <text class="mono b" x="721" y="522" text-anchor="middle">des::message</text>
  <text class="s mut" x="721" y="539" text-anchor="middle">event fields by tag</text>
  <text class="s mut" x="656" y="574">values per class;</text>
  <text class="s mut" x="656" y="590">reset() keeps one per run</text>
  <text class="s mut" x="656" y="606">→ confidence intervals</text>

  <line class="ln" x1="786" y1="525" x2="834" y2="525" marker-end="url(#head-ln)"/>
  <text class="s mut" x="810" y="518" text-anchor="middle">update</text>

  <rect class="box dash" x="836" y="502" width="128" height="124" rx="6"/>
  <text class="h" x="850" y="522">observers</text>
  <text class="mono" x="850" y="542">scalar</text>
  <text class="mono" x="850" y="558">counter</text>
  <text class="mono" x="850" y="574">sample</text>
  <text class="mono" x="850" y="590">histogram</text>
  <text class="s mut" x="850" y="612">or your own</text>
</svg>
